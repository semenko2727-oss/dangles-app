<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dangles — League Coordination</title>
<style>
  :root{
    --ice:#eef3f5;
    --board:#0f2d3d;
    --rink-blue:#1f5c73;
    --amber:#d98e04;
    --line-red:#a3312c;
    --paper:#ffffff;
    --ink:#132228;
    --muted:#5c7681;
    --font-display: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ice);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  header{background:var(--board);color:var(--ice);padding:24px 20px 18px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(90deg, var(--line-red) 0 24px, transparent 24px 36px);opacity:.8;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600;margin-bottom:6px;}
  h1{font-family:var(--font-display);font-size:26px;margin:0 0 4px;font-weight:700;}
  .tagline{color:#b9cdd4;font-size:13px;margin:0 0 14px;max-width:520px;}
  .role-switch{display:flex;gap:6px;flex-wrap:wrap;}
  .role-chip{
    font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;
    border:1px solid #3a5866;background:transparent;color:#cfe0e6;cursor:pointer;
  }
  .role-chip.active{background:var(--amber);border-color:var(--amber);color:#33240a;}
  nav{display:flex;background:var(--paper);border-bottom:1px solid #d7e0e3;position:sticky;top:0;z-index:10;overflow-x:auto;}
  nav button{flex:1;min-width:80px;padding:14px 6px;border:none;background:transparent;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
  nav button.active{color:var(--rink-blue);border-bottom-color:var(--amber);}
  main{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  .panel{display:none;}
  .panel.active{display:block;}
  .card{background:var(--paper);border:1px solid #dbe4e7;border-radius:10px;padding:16px;margin-bottom:12px;}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;}
  .game-title{font-weight:700;font-size:15px;margin:0;}
  .game-meta{font-size:13px;color:var(--muted);margin:2px 0 0;}
  .badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;}
  .badge.open{background:#fdecc8;color:#7a5300;}
  .badge.filled{background:#dcefe3;color:#1f6b3d;}
  .badge.needed{background:#f7d9d7;color:var(--line-red);}
  .badge.role{background:#e4edf0;color:var(--rink-blue);}
  button.action{background:var(--rink-blue);color:#fff;border:none;padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;margin-right:6px;}
  button.action:hover{background:#164555;}
  button.action.secondary{background:transparent;color:var(--rink-blue);border:1px solid var(--rink-blue);}
  button.action.danger{background:transparent;color:var(--line-red);border:1px solid var(--line-red);}
  button.action:disabled{background:#dcefe3;color:#1f6b3d;cursor:default;}
  .section-title{font-family:var(--font-display);font-size:18px;margin:22px 0 10px;color:var(--board);display:flex;align-items:baseline;gap:8px;}
  .section-title span{font-size:12px;font-weight:400;color:var(--muted);font-family:var(--font-body);}
  .vol-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eaf0f2;}
  .vol-row:last-child{border-bottom:none;}
  .vol-name{font-size:14px;font-weight:600;}
  .vol-sub{font-size:12px;color:var(--muted);}
  .stat-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .stat{flex:1;min-width:100px;background:var(--paper);border:1px solid #dbe4e7;border-radius:10px;padding:12px;text-align:center;}
  .stat b{display:block;font-size:22px;font-family:var(--font-display);color:var(--rink-blue);}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .empty-note{font-size:13px;color:var(--muted);text-align:center;padding:20px 0;}
  select, input[type=text]{width:100%;padding:8px 10px;border:1px solid #cdd9dd;border-radius:6px;font-size:13px;margin-top:4px;}
  .field-label{font-size:12px;font-weight:600;color:var(--muted);margin-top:10px;display:block;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--board);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center;max-width:90%;}
  .toast.show{opacity:1;}
  .locked-note{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px;}
  .roster-tag{display:inline-block;background:#e4edf0;color:var(--rink-blue);font-size:12px;padding:3px 9px;border-radius:999px;margin:3px 4px 0 0;}
  .add-row{display:flex;gap:6px;margin-top:10px;}
  .add-row input{flex:1;margin-top:0;}
  .add-row button{margin-top:0;white-space:nowrap;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Prototype · Pembina Valley Region</div>
  <h1>Dangles</h1>
  <p class="tagline">Ice time, referees, rosters, and volunteers for small-town leagues sharing one rink and a small crew of people.</p>
  <div class="role-switch">
    <button class="role-chip active" data-role="president">President</button>
    <button class="role-chip" data-role="coach">Coach</button>
    <button class="role-chip" data-role="parent">Parent / Volunteer</button>
  </div>
</header>

<nav>
  <button class="tab-btn active" data-tab="ice">Ice</button>
  <button class="tab-btn" data-tab="teams">Teams</button>
  <button class="tab-btn" data-tab="refs">Refs</button>
  <button class="tab-btn" data-tab="vol">Volunteers</button>
</nav>

<main>

  <div class="panel active" id="ice">
    <div class="stat-row">
      <div class="stat"><b id="stat-games">--</b><span>Games</span></div>
      <div class="stat"><b id="stat-open-ref">--</b><span>Open Refs</span></div>
      <div class="stat"><b id="stat-open-vol">--</b><span>Open Vol.</span></div>
    </div>
    <div class="section-title">This Week's Ice <span>Carman Community Arena</span></div>
    <div id="ice-list"></div>
    <div id="ice-admin"></div>
  </div>

  <div class="panel" id="teams">
    <div class="section-title">Teams &amp; Rosters <span id="teams-role-note"></span></div>
    <div id="teams-list"></div>
  </div>

  <div class="panel" id="refs">
    <div class="section-title">Open Games <span>Tap to claim</span></div>
    <div id="ref-list"></div>
  </div>

  <div class="panel" id="vol">
    <div class="section-title">Volunteer Tasks <span>This week</span></div>
    <div id="vol-list"></div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
let currentRole = "president"; // president | coach | parent

const state = {
  teams: [
    { id:1, name:"Carman U11", coach:"J. Reimer", president:"L. Toews",
      roster:["A. Klassen","B. Friesen","C. Peters","D. Wall"] },
    { id:2, name:"Carman U15 Rep", coach:"T. Enns", president:"L. Toews",
      roster:["E. Dueck","F. Braun","G. Loewen"] },
    { id:3, name:"Carman Adult Rec", coach:"— (self-managed)", president:"L. Toews",
      roster:["H. Sawatzky","I. Giesbrecht"] }
  ],
  games: [
    { id:1, division:"U11 House League", home:"Carman", away:"Miami", day:"Sat", time:"9:00 AM",
      ref: null, refCert:"Level 1+",
      volunteers: [
        { task:"Timekeeper", filled:false, name:null },
        { task:"Scorekeeper", filled:true, name:"D. Klassen" }
      ]
    },
    { id:2, division:"U15 Rep", home:"Carman", away:"Notre Dame", day:"Sat", time:"11:15 AM",
      ref: "T. Wiebe", refCert:"Level 2",
      volunteers: [
        { task:"Timekeeper", filled:true, name:"S. Friesen" },
        { task:"Scorekeeper", filled:false, name:null },
        { task:"Ice Re-flood Crew", filled:false, name:null }
      ]
    },
    { id:3, division:"Adult Rec", home:"Carman", away:"Roland", day:"Sun", time:"6:30 PM",
      ref: null, refCert:"Level 1",
      volunteers: [ { task:"Timekeeper", filled:false, name:null } ]
    },
    { id:4, division:"U9 Initiation", home:"Carman", away:"Carman B", day:"Sun", time:"8:00 AM",
      ref: null, refCert:"Level 1",
      volunteers: [ { task:"Scorekeeper", filled:false, name:null } ]
    }
  ]
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1900);
}

// ---------- ROLE PERMISSIONS ----------
// president: full control — add/remove games, edit any roster, reassign coaches
// coach: edit roster for their own team(s) only
// parent: view-only on teams, can claim ref/volunteer slots

function isPresident(){ return currentRole === "president"; }
function isCoach(){ return currentRole === "coach"; }

// ---------- ICE ----------
function renderIce(){
  const el = document.getElementById('ice-list');
  el.innerHTML = '';
  state.games.forEach(g=>{
    const openRef = g.ref ? 0 : 1;
    const openVol = g.volunteers.filter(v=>!v.filled).length;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <div>
          <p class="game-title">${g.home} vs ${g.away}</p>
          <p class="game-meta">${g.division} · ${g.day} ${g.time}</p>
        </div>
        ${ (openRef+openVol)===0
          ? '<span class="badge filled">Fully Staffed</span>'
          : `<span class="badge needed">${openRef+openVol} spot${(openRef+openVol)>1?'s':''} open</span>`}
      </div>
      <p class="game-meta">Ref: ${g.ref ? g.ref : 'Unassigned'} &nbsp;·&nbsp; Volunteers: ${g.volunteers.length - openVol}/${g.volunteers.length} filled</p>
      ${isPresident() ? `<button class="action danger" onclick="removeGame(${g.id})">Remove game</button>` : ''}
    `;
    el.appendChild(card);
  });

  const adminEl = document.getElementById('ice-admin');
  if(isPresident()){
    adminEl.innerHTML = `
      <div class="section-title">Add a Game <span>President only</span></div>
      <div class="card">
        <span class="field-label">Home team</span>
        <input type="text" id="new-home" placeholder="e.g. Carman U13">
        <span class="field-label">Away team</span>
        <input type="text" id="new-away" placeholder="e.g. Miami">
        <span class="field-label">Day / Time</span>
        <input type="text" id="new-time" placeholder="e.g. Sat 1:00 PM">
        <button class="action" onclick="addGame()">Add to schedule</button>
      </div>
    `;
  } else {
    adminEl.innerHTML = `<p class="locked-note">Only league presidents can add or remove games from the schedule.</p>`;
  }

  document.getElementById('stat-games').textContent = state.games.length;
  document.getElementById('stat-open-ref').textContent = state.games.filter(g=>!g.ref).length;
  document.getElementById('stat-open-vol').textContent = state.games.reduce((n,g)=>n+g.volunteers.filter(v=>!v.filled).length,0);
}

function addGame(){
  const home = document.getElementById('new-home').value.trim() || "Carman";
  const away = document.getElementById('new-away').value.trim() || "TBD";
  const time = document.getElementById('new-time').value.trim() || "TBD";
  const id = Math.max(...state.games.map(g=>g.id)) + 1;
  state.games.push({ id, division:"New Division", home, away, day:"", time, ref:null, refCert:"Level 1", volunteers:[{task:"Timekeeper", filled:false, name:null}] });
  renderAll();
  toast(`Added ${home} vs ${away} to the schedule`);
}

function removeGame(id){
  state.games = state.games.filter(g=>g.id!==id);
  renderAll();
  toast(`Game removed from schedule`);
}

// ---------- TEAMS / ROSTERS ----------
function renderTeams(){
  const el = document.getElementById('teams-list');
  el.innerHTML = '';
  document.getElementById('teams-role-note').textContent =
    isPresident() ? "President view — full control" :
    isCoach() ? "Coach view — edit your team's roster" :
    "View only";

  state.teams.forEach(team=>{
    const canEdit = isPresident() || (isCoach() && team.id <= 2); // demo: coach role can edit first two teams
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <div>
          <p class="game-title">${team.name}</p>
          <p class="game-meta">Coach: ${team.coach} &nbsp;·&nbsp; President: ${team.president}</p>
        </div>
        <span class="badge role">${team.roster.length} players</span>
      </div>
      <div id="roster-${team.id}">
        ${team.roster.map((p,idx)=>`<span class="roster-tag">${p} ${canEdit?`<span style="cursor:pointer;color:var(--line-red);" onclick="removePlayer(${team.id},${idx})">×</span>`:''}</span>`).join('')}
      </div>
      ${canEdit ? `
        <div class="add-row">
          <input type="text" id="add-player-${team.id}" placeholder="Add player name">
          <button class="action" onclick="addPlayer(${team.id})">Add</button>
        </div>
        ${isPresident() ? `
          <span class="field-label">Reassign coach</span>
          <div class="add-row">
            <input type="text" id="new-coach-${team.id}" placeholder="New coach name">
            <button class="action secondary" onclick="setCoach(${team.id})">Set</button>
          </div>
        ` : ''}
      ` : `<p class="locked-note">Only this team's coach or the league president can edit this roster.</p>`}
    `;
    el.appendChild(card);
  });
}

function addPlayer(teamId){
  const input = document.getElementById(`add-player-${teamId}`);
  const name = input.value.trim();
  if(!name) return;
  const team = state.teams.find(t=>t.id===teamId);
  team.roster.push(name);
  renderTeams();
  toast(`Added ${name} to ${team.name}`);
}

function removePlayer(teamId, idx){
  const team = state.teams.find(t=>t.id===teamId);
  const removed = team.roster.splice(idx,1);
  renderTeams();
  toast(`Removed ${removed[0]} from ${team.name}`);
}

function setCoach(teamId){
  const input = document.getElementById(`new-coach-${teamId}`);
  const name = input.value.trim();
  if(!name) return;
  const team = state.teams.find(t=>t.id===teamId);
  team.coach = name;
  renderTeams();
  toast(`${team.name} coach set to ${name}`);
}

// ---------- REFS ----------
function renderRefs(){
  const el = document.getElementById('ref-list');
  el.innerHTML = '';
  const open = state.games.filter(g=>!g.ref);
  if(open.length===0){
    el.innerHTML = '<p class="empty-note">All games have a ref assigned.</p>';
    return;
  }
  open.forEach(g=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <div>
          <p class="game-title">${g.home} vs ${g.away}</p>
          <p class="game-meta">${g.division} · ${g.day} ${g.time} · Requires ${g.refCert}</p>
        </div>
        <span class="badge open">Open</span>
      </div>
      <button class="action" onclick="claimRef(${g.id})">Claim this game</button>
    `;
    el.appendChild(card);
  });
}

function claimRef(id){
  const g = state.games.find(x=>x.id===id);
  g.ref = "You";
  renderAll();
  toast(`You're reffing ${g.home} vs ${g.away} — ${g.day} ${g.time}`);
}

// ---------- VOLUNTEERS ----------
function renderVol(){
  const el = document.getElementById('vol-list');
  el.innerHTML = '';
  let anyOpen = false;
  state.games.forEach(g=>{
    g.volunteers.forEach((v, idx)=>{
      if(v.filled) return;
      anyOpen = true;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <div>
            <p class="game-title">${v.task}</p>
            <p class="game-meta">${g.home} vs ${g.away} · ${g.day} ${g.time}</p>
          </div>
          <span class="badge needed">Needed</span>
        </div>
        <button class="action" onclick="claimVol(${g.id}, ${idx})">Sign up</button>
      `;
      el.appendChild(card);
    });
  });
  if(!anyOpen){
    el.innerHTML = '<p class="empty-note">Every task this week is covered.</p>';
  }
}

function claimVol(gameId, idx){
  const g = state.games.find(x=>x.id===gameId);
  g.volunteers[idx].filled = true;
  g.volunteers[idx].name = "You";
  renderAll();
  toast(`Signed up: ${g.volunteers[idx].task} for ${g.home} vs ${g.away}`);
}

function renderAll(){
  renderIce();
  renderTeams();
  renderRefs();
  renderVol();
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

document.querySelectorAll('.role-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.role-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    currentRole = chip.dataset.role;
    renderAll();
    toast(`Viewing as: ${chip.textContent}`);
  });
});

renderAll();
</script>
</body>
</html>
